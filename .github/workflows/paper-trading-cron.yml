name: Paper trading cron

# Keeps the paper-trading strategies advancing even when nobody has the app
# open (laptop closed, asleep, or off). Runs every 5 minutes (GitHub's
# shortest supported interval) — only possible for free because this repo
# is public: Actions minutes are unlimited/free on public repos regardless
# of frequency, unlike a private repo's ~2000 min/month free tier (made
# public specifically for this; see README). Every run is still a genuinely
# cold scan (no warm in-memory cache carries over between runs on a fresh
# container), ~1-2 minutes each — at 5-minute cadence that's real, continual
# compute, just free. This cadence matters most for the odds-swing strategy
# (buy-low-sell-high on live in-game price moves — the whole point is
# catching a swing before it reverts, which hourly checks could miss).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one scan + paper-trading cycle
        env:
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional — only needed once the dashboard is deployed (see
          # README "Deploy"). When set, this run also writes the scan +
          # paper-trading state to Redis, which is what the deployed
          # dashboard reads instead of recomputing live.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python paper_trade_cron.py

      - name: Commit updated paper-trading state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/paper_trades*.json
          if ! git diff --cached --quiet; then
            git commit -m "Paper trading: automated cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No state changes this run."
          fi
